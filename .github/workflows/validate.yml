name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  # Static validation only. Running the suite needs a full Crucible stack -
  # Keycloak, every app API and UI, Postgres - which is provisioned per job by
  # .github/workflows/e2e.yml. This job checks everything that can be checked
  # without one. It is not a substitute for running the suite; it catches the
  # breakage that would otherwise only surface minutes into a real run, on a
  # machine that has a stack.
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # No browsers are installed: none of the checks below launch one.
      - name: Install dependencies
        run: npm ci

      # Playwright strips types instead of checking them, so a spec calling a
      # helper with the wrong arguments only fails at runtime, against a live
      # stack, as a confusing timeout. tsc catches it here.
      - name: Typecheck
        run: npm run typecheck

      # Fails on `test.skip(!thing, ...)` and bare `test.skip()`, which report a
      # green run while asserting nothing. See scripts/check-self-skips.mjs.
      - name: Check for conditional self-skips
        run: npm run check:skips

      # Fails on any wait antipattern without an escape comment: fixed sleeps,
      # networkidle waits, Promise.race over wait calls, long timeouts, and
      # test.setTimeout. See scripts/check-wait-antipatterns.mjs.
      - name: Check for wait antipatterns
        run: npm run check:waits

      # Table-driven self-check of playwright-run-filters.ts: which apps a run's
      # path filters include. Setup and teardown gate provisioning and every
      # app's purge on that answer. See scripts/check-run-filters.mjs.
      - name: Check run-filter parsing
        run: npm run check:run-filters

      # Loads every spec and fixture. Catches syntax errors, unresolved imports,
      # renamed exports and duplicate test titles, and fails outright if zero
      # tests are discovered - which is what a broken testMatch or a spec moved
      # out of a `tests/` directory looks like. `--list` does not run
      # globalSetup, so no stack is required.
      - name: Check test discovery
        run: npm run check:discovery

      # Lint GitHub Actions workflow files. Catches syntax errors, invalid action
      # references, shellcheck findings in run blocks, and common mistakes.
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.8

      # Validate the CI stack compose file for syntax errors and misconfigurations.
      - name: Check CI stack compose
        run: docker compose -f ci/stack/compose.yaml config -q

      # Test the e2e-result gate logic: pass when plan succeeded and e2e succeeded
      # or was skipped; fail otherwise. This is the one check marked as required.
      - name: Test result gate
        run: bash ci/test-result-gate.sh

      # Test PR comment shell script logic
      - name: Test PR comment script
        run: bash ci/test-pr-comment.sh

      # Test regression issue shell script logic
      - name: Test regression issue script
        run: bash ci/test-regression-issue.sh
