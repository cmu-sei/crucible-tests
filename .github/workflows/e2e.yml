name: E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      apps:
        description: 'Comma-separated app list (empty = all)'
        required: false
        type: string
        default: ''

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_runs: ${{ steps.plan.outputs.has_runs }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Plan CI runs
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          APPS_INPUT: ${{ inputs.apps }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              node --no-warnings scripts/plan-ci-runs.mjs --base "$PR_BASE_SHA" --head "$HEAD_SHA"
              ;;
            push)
              # A new branch has no before; after a force push the old tip is not in this
              # clone's history. Either way there is nothing to diff, so run everything.
              if [[ "$EVENT_BEFORE" == "0000000000000000000000000000000000000000" ]] \
                || ! git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
                node --no-warnings scripts/plan-ci-runs.mjs --full
              else
                node --no-warnings scripts/plan-ci-runs.mjs --base "$EVENT_BEFORE" --head "$HEAD_SHA"
              fi
              ;;
            schedule)
              node --no-warnings scripts/plan-ci-runs.mjs --full
              ;;
            workflow_dispatch)
              if [[ -n "$APPS_INPUT" ]]; then
                node --no-warnings scripts/plan-ci-runs.mjs --full --apps "$APPS_INPUT"
              else
                node --no-warnings scripts/plan-ci-runs.mjs --full
              fi
              ;;
          esac

  e2e:
    name: E2E
    needs: plan
    if: needs.plan.outputs.has_runs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/e2e-app.yml
    with:
      app: ${{ matrix.app }}
      specs: ${{ matrix.specs }}
      full: ${{ github.event_name == 'schedule' }}
    secrets: inherit

  e2e-result:
    name: E2E Result
    runs-on: ubuntu-24.04
    needs: [plan, e2e]
    if: always()

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Evaluate result
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: bash ci/result-gate.sh "$PLAN_RESULT" "$E2E_RESULT"

  pr-comment:
    name: PR Comment
    runs-on: ubuntu-24.04
    needs: [plan, e2e]
    if: always() && github.event_name == 'pull_request' && needs.plan.outputs.has_runs == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-eval-*
          path: artifacts
          # Each artifact holds its own <name>/ folder (see e2e-app.yml).
          merge-multiple: true

      - name: Render comment
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          node --no-warnings scripts/render-pr-comment.mjs \
            --dir artifacts \
            --run-url "$RUN_URL" \
            --sha "$SHA" > body.md

      - name: Post or update comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [[ -s body.md ]]; then
            bash ci/pr-comment.sh "$PR_NUMBER" body.md
          else
            bash ci/pr-comment.sh "$PR_NUMBER" -
          fi

  collect:
    name: Collect new failures
    runs-on: ubuntu-24.04
    needs: e2e
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    outputs:
      confirm_matrix: ${{ steps.build_matrix.outputs.matrix }}
      has_confirms: ${{ steps.build_matrix.outputs.has_confirms }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-eval-*
          path: artifacts
          # Each artifact holds its own <name>/ folder (see e2e-app.yml).
          merge-multiple: true

      - name: Build confirm matrix
        id: build_matrix
        run: |
          # Exclude e2e-eval-confirm-* artifacts (only read first-pass evals)
          apps=()
          for dir in artifacts/e2e-eval-*; do
            if [[ ! -d "$dir" ]]; then continue; fi
            dirname=$(basename "$dir")
            if [[ "$dirname" == e2e-eval-confirm-* ]]; then continue; fi

            app="${dirname#e2e-eval-}"
            eval_file="$dir/ci-evaluation.json"

            if [[ ! -f "$eval_file" ]]; then continue; fi

            # Check if there are newFailures
            new_failures=$(node --no-warnings -p "
              const fs = require('fs');
              const e = JSON.parse(fs.readFileSync('$eval_file', 'utf8'));
              JSON.stringify(e.newFailures || []);
            ")

            if [[ "$new_failures" != "[]" ]]; then
              # Extract unique spec files from newFailures
              specs=$(node --no-warnings -p "
                const fs = require('fs');
                const e = JSON.parse(fs.readFileSync('$eval_file', 'utf8'));
                const files = [...new Set((e.newFailures || []).map(k => k.file))];
                files.join(' ');
              ")

              apps+=("{\"app\":\"$app\",\"specs\":\"$specs\"}")
            fi
          done

          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has_confirms=false" >> "$GITHUB_OUTPUT"
          else
            matrix=$(printf '%s\n' "${apps[@]}" | jq -cs '{include: .}')
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
            echo "has_confirms=true" >> "$GITHUB_OUTPUT"
          fi

  confirm:
    name: Confirm
    needs: collect
    if: always() && needs.collect.outputs.has_confirms == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.collect.outputs.confirm_matrix) }}
    uses: ./.github/workflows/e2e-app.yml
    with:
      app: ${{ matrix.app }}
      specs: ${{ matrix.specs }}
      full: false
      confirm: true
    secrets: inherit

  regressions:
    name: Report regressions
    runs-on: ubuntu-24.04
    needs: [e2e, confirm]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      issues: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Download all evaluation artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-eval-*
          path: artifacts
          # Each artifact holds its own <name>/ folder (see e2e-app.yml).
          merge-multiple: true

      - name: Download all digest artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-digests-*
          path: artifacts
          # Each artifact holds its own <name>/ folder (see e2e-app.yml).
          merge-multiple: true
        continue-on-error: true

      - name: Find last clean weekly run
        id: last_clean
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Find the most recent successful run of e2e.yml that was a full weekly run
          # (schedule event, or workflow_dispatch with empty apps input)
          runs=$(gh run list \
            --workflow e2e.yml \
            --status success \
            --limit 50 \
            --json databaseId,event,createdAt)

          last_clean_id=""
          for id in $(echo "$runs" | jq -r '.[] | select(.event == "schedule" or .event == "workflow_dispatch") | .databaseId'); do
            # Exclude the current run
            if [[ "$id" == "${{ github.run_id }}" ]]; then continue; fi

            # Check if this run has digest artifacts for all apps
            # A successful full run should have digests for each app
            # Use --paginate to get all artifacts (default page size 30, full run has 33+)
            artifacts=$(gh api --paginate "repos/$REPO/actions/runs/$id/artifacts" --jq '.artifacts[].name')

            has_all=true
            for app in alloy blueprint caster cite console gallery gameboard player playerVm steamfitter topomojo; do
              if ! echo "$artifacts" | grep -q "^e2e-digests-$app$"; then
                has_all=false
                break
              fi
            done

            if [[ "$has_all" == "true" ]]; then
              last_clean_id="$id"
              break
            fi
          done

          echo "last_clean_id=$last_clean_id" >> "$GITHUB_OUTPUT"

          if [[ -n "$last_clean_id" ]]; then
            echo "Found last clean run: $last_clean_id"
          else
            echo "No earlier clean run found"
          fi

      - name: Download last clean digest artifacts
        if: steps.last_clean.outputs.last_clean_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="${{ steps.last_clean.outputs.last_clean_id }}"
          mkdir -p artifacts/last-clean
          for app in alloy blueprint caster cite console gallery gameboard player playerVm steamfitter topomojo; do
            gh run download "$run_id" \
              --name "e2e-digests-$app" \
              --dir artifacts/last-clean || true
          done
        continue-on-error: true

      - name: Report regressions for each app
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          for app in alloy blueprint caster cite console gallery gameboard player playerVm steamfitter topomojo; do
            first_eval="artifacts/e2e-eval-$app/ci-evaluation.json"
            confirm_eval="artifacts/e2e-eval-confirm-$app/ci-evaluation.json"
            current_digests="artifacts/e2e-digests-$app/digests.json"
            last_clean_digests="artifacts/last-clean/e2e-digests-$app/digests.json"

            # Skip if first eval doesn't exist (app didn't run)
            if [[ ! -f "$first_eval" ]]; then
              echo "Skipping $app: no evaluation found"
              continue
            fi

            # Check if app ran clean (ok && !didNotRun && no newFailures)
            eval_status=$(node --no-warnings -p "
              const fs = require('fs');
              const e = JSON.parse(fs.readFileSync('$first_eval', 'utf8'));
              JSON.stringify({
                ok: e.ok || false,
                didNotRun: e.didNotRun || false,
                newFailuresCount: (e.newFailures || []).length
              });
            ")

            is_ok=$(echo "$eval_status" | jq -r '.ok')
            did_not_run=$(echo "$eval_status" | jq -r '.didNotRun')
            new_failures=$(echo "$eval_status" | jq -r '.newFailuresCount')

            if [[ "$is_ok" == "true" && "$did_not_run" == "false" && "$new_failures" == "0" ]]; then
              # App ran clean, close any open regression issue
              node --no-warnings -p "
                const { renderRecoveredComment } = require('./scripts/lib/ci-regressions.mjs');
                renderRecoveredComment('$app', { runUrl: '$RUN_URL' });
              " > "recovered-$app.txt"
              bash ci/regression-issue.sh "$app" --recovered "recovered-$app.txt"
              continue
            fi

            # If app didn't run or crashed, skip it (leave issue alone)
            if [[ "$did_not_run" == "true" ]]; then
              echo "$app: did not run, skipping regression check"
              continue
            fi

            # App has failures, check for confirmed regressions
            args=(
              --app "$app"
              --first "$first_eval"
              --run-url "$RUN_URL"
              --repo "$REPO"
            )

            if [[ -f "$confirm_eval" ]]; then
              args+=(--confirm "$confirm_eval")
            fi

            if [[ -f "$current_digests" ]]; then
              args+=(--current-digests "$current_digests")
            fi

            if [[ -f "$last_clean_digests" ]]; then
              args+=(--last-clean-digests "$last_clean_digests")
            fi

            # Generate regression report
            result=$(node --no-warnings scripts/report-regressions.mjs "${args[@]}")
            action=$(echo "$result" | jq -r '.action')

            if [[ "$action" == "none" ]]; then
              echo "$app: no confirmed regressions"
              {
                echo "## $app: Unconfirmed"
                echo "New failures did not reproduce on confirming rerun."
                echo ""
              } >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            # Write issue body
            echo "$result" > "issue-$app.json"
            bash ci/regression-issue.sh "$app" "issue-$app.json"

            {
              echo "## $app: Regression reported"
              echo "See issue for details."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          done
